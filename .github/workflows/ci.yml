name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install build twine
      # The default build produces an sdist, then builds the wheel FROM that sdist.
      - run: python -m build
      - run: python scripts/verify_release.py dist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - name: Create a clean virtual environment
        run: |
          python -m venv .release-venv
          python -c "import os; from pathlib import Path; scripts = Path('.release-venv').resolve() / ('Scripts' if os.name == 'nt' else 'bin'); Path(os.environ['GITHUB_PATH']).open('a').write(str(scripts) + '\n')"
      - name: Install the built wheel and test dependencies
        shell: bash
        run: python -m pip install dist/*.whl pytest
      - run: python -m pip check
      - run: forgemcp --help
      - run: python -I scripts/smoke_install.py
      # Override pytest's source-path setting so these tests exercise the wheel.
      - run: python -m pytest -q -o pythonpath=
