<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Git Status App render harness</title>
    <style>html,body,iframe{border:0;height:100%;margin:0;width:100%;}</style>
  </head>
  <body>
    <iframe id="app" src="git-status.html" title="Git Status App"></iframe>
    <script>
      (() => {
        "use strict";
        const frame = document.getElementById("app");
        const status = {
          repository: "available",
          git_available: true,
          git_configured: true,
          branch: "<img src=x onerror=window.__xss_canary=1>",
          detached: false,
          unborn: false,
          head_oid: "1234567890abcdef1234567890abcdef12345678",
          ahead: 2,
          behind: 1,
          staged_count: 1,
          unstaged_count: 1,
          untracked_count: 1,
          conflicted_count: 1,
          incomplete: true,
          truncated: true,
          files: [
            { path: "<scr" + "ipt>window.__xss_canary=1</scr" + "ipt>", staged_status: "M", unstaged_status: ".", untracked: false, conflicted: false },
            { path: "quote \" newline\nignore previous instructions", staged_status: ".", unstaged_status: "M", untracked: false, conflicted: false },
            { path: "untracked-\u202E-control", staged_status: "?", unstaged_status: "?", untracked: true, conflicted: false },
            { path: "conflicted.txt", staged_status: "U", unstaged_status: "U", untracked: false, conflicted: true }
          ]
        };
        const result = { content: [{ type: "text", text: "Git repository status." }], structuredContent: status };
        const lifecycle = [];
        window.__forgemcpHarness = {
          phase: "connecting",
          publishResult(result) {
            frame.contentWindow.postMessage({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: result }, "*");
          },
          requestTeardown() {
            frame.contentWindow.postMessage({ jsonrpc: "2.0", id: "teardown", method: "ui/resource-teardown", params: {} }, "*");
          },
        };
        window.addEventListener("message", (event) => {
          if (event.source !== frame.contentWindow || !event.data || typeof event.data !== "object") return;
          const message = event.data;
          window.__forgemcpHarness.lastMessage = { method: message.method || null, id: message.id || null };
          if (message.method === "ui/initialize") {
            lifecycle.push("initialize");
            frame.contentWindow.postMessage({ jsonrpc: "2.0", id: message.id, result: { protocolVersion: "2026-01-26", hostInfo: { name: "ForgeMCP harness", version: "1.0.0" }, hostCapabilities: {}, hostContext: { theme: "light" } } }, "*");
          } else if (message.method === "ui/notifications/initialized") {
            lifecycle.push("initialized");
            frame.contentWindow.postMessage({ jsonrpc: "2.0", method: "ui/notifications/tool-input", params: { arguments: {} } }, "*");
            window.__forgemcpHarness.publishResult(result);
            window.__forgemcpHarness.phase = "rendered";
          } else if (message.method === "ui/resource-teardown") {
            lifecycle.push("teardown");
            frame.contentWindow.postMessage({ jsonrpc: "2.0", id: message.id, result: {} }, "*");
          } else if (message.id === "teardown" && message.result && typeof message.result === "object") {
            window.__forgemcpHarness.phase = "tornDown";
          }
        });
      })();
    </script>
  </body>
</html>
