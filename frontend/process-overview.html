<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Process overview</title>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <header>
        <div>
          <span class="eyebrow">ForgeMCP</span>
          <h1>External processes</h1>
        </div>
        <div class="totals">
          <span><strong id="running-count">0</strong> running</span>
          <span><strong id="completed-count">0</strong> completed</span>
        </div>
      </header>
      <p id="status">Waiting for process state…</p>
      <div id="processes" class="processes"></div>
    </main>
    <script type="module" src="/src/process-overview.js"></script>
  </body>
</html>
